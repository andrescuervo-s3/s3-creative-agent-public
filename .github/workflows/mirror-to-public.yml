name: Mirror to public repo

on:
  push:
    branches: [main]

jobs:
  mirror:
    # This workflow file is itself mirrored to the public repo, where it would
    # run with no PUBLIC_REPO_TOKEN and fail on every push. Only run in the
    # private source repo.
    if: github.repository == 'andrescuervo-s3/s3-creative-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to public mirror
        run: |
          git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/andrescuervo-s3/s3-creative-agent-public.git
          git push public main --force
